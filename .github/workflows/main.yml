name: Xray VLESS Server (TryCloudflare)

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download Xray-core
        run: |
          mkdir -p $HOME/xray
          cd $HOME/xray
          curl -fsSL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip
          chmod +x xray
          ./xray version

      - name: Download cloudflared
        run: |
          mkdir -p $HOME/cf
          curl -fsSL -o $HOME/cf/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x $HOME/cf/cloudflared
          $HOME/cf/cloudflared --version

      - name: Generate UUID and Xray config
        id: xray_setup
        run: |
          UUID=$($HOME/xray/xray uuid)
          WSPATH="/$(openssl rand -hex 8)"
          echo "UUID=$UUID" >> "$GITHUB_OUTPUT"
          echo "WSPATH=$WSPATH" >> "$GITHUB_OUTPUT"

          cat > $HOME/xray/config.json <<EOF
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "port": 8080,
                "listen": "127.0.0.1",
                "protocol": "vless",
                "settings": {
                  "clients": [{ "id": "$UUID" }],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": { "path": "$WSPATH" }
                }
              }
            ],
            "outbounds": [{ "protocol": "freedom" }]
          }
          EOF

          echo "--- Generated Xray config ---"
          cat $HOME/xray/config.json

      - name: Start Xray in background
        run: |
          nohup $HOME/xray/xray run -c $HOME/xray/config.json > /tmp/xray.log 2>&1 &
          sleep 3
          if ! pgrep -f "$HOME/xray/xray run" > /dev/null; then
            echo "❌ Xray failed to start:"
            cat /tmp/xray.log
            exit 1
          fi
          echo "✅ Xray is running"
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep 8080 || true

      - name: Start Quick Tunnel and capture URL
        id: tunnel
        run: |
          nohup $HOME/cf/cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:8080 \
            --logfile /tmp/argo.log > /dev/null 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/argo.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "$URL" ]; then
            echo "❌ Failed to obtain trycloudflare URL."
            cat /tmp/argo.log
            exit 1
          fi
          DOMAIN=${URL#https://}
          echo "DOMAIN=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "✅ Tunnel URL: $URL"

      - name: Print VLESS Configuration
        run: |
          DOMAIN="${{ steps.tunnel.outputs.DOMAIN }}"
          UUID="${{ steps.xray_setup.outputs.UUID }}"
          WSPATH="${{ steps.xray_setup.outputs.WSPATH }}"
          VLESS="vless://${UUID}@${DOMAIN}:443?encryption=none&security=tls&sni=${DOMAIN}&type=ws&host=${DOMAIN}&path=${WSPATH}#GHActions-TryCloudflare"

          echo "======================================================="
          echo "✅ VLESS Configuration Generated"
          echo "======================================================="
          echo " Server Address : $DOMAIN"
          echo " Port           : 443"
          echo " UUID           : $UUID"
          echo " Transport      : ws (WebSocket)"
          echo " Path           : $WSPATH"
          echo " TLS            : tls"
          echo " SNI / Host     : $DOMAIN"
          echo ""
          echo "📋 VLESS URL (copy into v2rayNG / v2rayN):"
          echo "$VLESS"
          echo "======================================================="

      - name: Keep tunnel alive (up to GH Actions max runtime)
        run: |
          echo "Server is up. Cancel the workflow to stop the tunnel."
          sleep 21600
